name: bede-workspace-mcp CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bede-workspace-mcp/**"
  push:
    branches: [main]
    paths:
      - "bede-workspace-mcp/**"

defaults:
  run:
    working-directory: bede-workspace-mcp

jobs:
  build-push:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./bede-workspace-mcp
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/josephradford/bede-workspace-mcp:latest
            ghcr.io/josephradford/bede-workspace-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
